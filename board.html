<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#e9e8e4">
  <meta name="description" content="王兆鑫的洞洞板个人作品集。">
  <title>洞洞板 / 王兆鑫</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="direct-board-page">
  <main class="portfolio" aria-label="王兆鑫个人作品集">
    <section class="screen board-screen" aria-label="洞洞板主页面">
      <div class="board-canvas">
        <img class="board-base" src="assets/board-stationary.png" alt="王兆鑫的洞洞板作品集。左侧为简介与联系方式，右侧挂有工作之外、项目、工作经历、技能与联系卡片。">
        <img class="detail-background" src="assets/detail-background.jpg" alt="" aria-hidden="true">
        <button class="detail-backdrop" type="button" aria-label="关闭工作之外，返回洞洞板"></button>
        <img class="detail-key-photo" src="assets/detail-key.jpg" alt="" aria-hidden="true">
        <div class="detail-key-photo-hit" aria-hidden="true"></div>
        <button class="detail-key-exit" type="button" aria-label="退出工作之外，返回洞洞板"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12h15m-6-6 6 6-6 6"/></svg></button>
        <button class="artifact artifact-key" data-artifact="key" style="left:25.139%;top:7.444%;width:9.861%;height:35.889%" aria-label="工作之外钥匙扣" type="button"><img src="assets/object-key.png" alt=""></button>
        <button class="artifact artifact-file" data-artifact="file" style="left:41.528%;top:15.889%;width:26.111%;height:61.556%" aria-label="工作项目文件夹" type="button"><img src="assets/object-file.png" alt=""></button>
        <button class="artifact artifact-id" data-artifact="id" style="left:72.778%;top:7.222%;width:17.847%;height:31.667%" aria-label="工作经历工牌" type="button"><img src="assets/object-id.png" alt=""></button>
        <button class="artifact artifact-skills" data-artifact="skills" style="left:27.361%;top:49.778%;width:11.667%;height:33.778%" aria-label="工作技能吊牌" type="button"><img src="assets/object-skills.png" alt=""></button>
        <button class="artifact artifact-contact" data-artifact="contact" style="left:71.042%;top:63.556%;width:13.819%;height:25%" aria-label="联系方式信封" type="button"><img src="assets/object-contact.png" alt=""></button>
        <button class="artifact artifact-note" data-artifact="note" style="left:87.431%;top:46%;width:9.444%;height:37.111%" aria-label="右侧纸质吊牌" type="button"><img src="assets/object-note.png" alt=""></button>
        <button class="legend-target" data-target="key" style="top:35.3%" type="button" aria-label="01 Key Tag，晃动工作之外钥匙扣"></button>
        <button class="legend-target" data-target="file" style="top:37.8%" type="button" aria-label="02 Clear File，晃动工作项目文件夹"></button>
        <button class="legend-target" data-target="id" style="top:40.3%" type="button" aria-label="03 ID Card，晃动工作经历工牌"></button>
        <button class="legend-target" data-target="skills" style="top:42.8%" type="button" aria-label="04 Black Badge，晃动工作技能吊牌"></button>
        <button class="legend-target" data-target="contact" style="top:45.3%" type="button" aria-label="05 Airmail Card，晃动联系方式信封"></button>
      </div>
    </section>
  </main>
  <script src="board-motion.js"></script>
</body>
</html>
